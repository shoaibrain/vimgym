name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: quality and fixture safety
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: mypy src/vimgym
      - run: pytest -q tests/test_fixture_safety.py tests/test_benchmark_generator.py

  shellcheck:
    name: shellcheck installer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck install.sh

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest -q --tb=short

  coverage:
    name: coverage gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Overall line and branch coverage
        run: |
          pytest -q --cov=vimgym --cov-branch --cov-report=xml --cov-report=term-missing
          coverage report --fail-under=85
          python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          root = ET.parse("coverage.xml").getroot()
          branch = float(root.attrib["branch-rate"]) * 100
          if branch < 75:
              raise SystemExit(f"branch coverage {branch:.2f}% is below 75%")
          print(f"branch coverage: {branch:.2f}%")
          PY
      - name: Critical persistence/security coverage
        run: |
          coverage json -o coverage.json
          python - <<'PY'
          import json
          data = json.load(open("coverage.json"))
          suffixes = ("/db.py", "/ingestion.py", "/pipeline/redact.py", "/backup.py", "/server.py")
          summaries = [value["summary"] for name, value in data["files"].items() if name.endswith(suffixes)]
          statements = sum(item["num_statements"] for item in summaries)
          covered = sum(item["covered_lines"] for item in summaries)
          branches = sum(item["num_branches"] for item in summaries)
          covered_branches = sum(item["covered_branches"] for item in summaries)
          line_rate = covered / statements * 100
          branch_rate = covered_branches / branches * 100
          print(f"critical line={line_rate:.2f}% branch={branch_rate:.2f}%")
          if line_rate < 90 or branch_rate < 85:
              raise SystemExit("critical-module coverage gate failed")
          PY

  browser-security:
    name: chromium security and accessibility
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,browser]"
      - run: python -m playwright install --with-deps chromium
      - run: pytest -q tests/test_browser_security.py tests/test_security_api_v2.py tests/test_ui_v2_static.py

  build:
    name: build sdist and wheel once
    runs-on: ubuntu-24.04
    needs: [quality, shellcheck, test, coverage, browser-security]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: twine check dist/*
      - name: Validate wheel package data
        run: |
          unzip -l dist/vimgym-*.whl | grep -F "vimgym/defaults/redaction-rules.json"
          unzip -l dist/vimgym-*.whl | grep -F "vimgym/ui/index.html"
      - run: cd dist && sha256sum vimgym-*.whl vimgym-*.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 30

  installed-wheel:
    name: installed wheel smoke (${{ matrix.os }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist
      - run: pip install dist/vimgym-*.whl
      - run: python -m pip check
      - name: Build isolated provider home
        run: |
          mkdir -p "$RUNNER_TEMP/home/.claude" "$RUNNER_TEMP/home/.codex"
          cp -R tests/fixtures/providers/claude/projects "$RUNNER_TEMP/home/.claude/projects"
          cp -R tests/fixtures/providers/codex/sessions "$RUNNER_TEMP/home/.codex/sessions"
          cp -R tests/fixtures/providers/codex/archived_sessions "$RUNNER_TEMP/home/.codex/archived_sessions"
      - name: Installed-wheel end-to-end smoke
        env:
          HOME: ${{ runner.temp }}/home
          CODEX_HOME: ${{ runner.temp }}/home/.codex
          VIMGYM_PATH: ${{ runner.temp }}/vault
        run: |
          vg --version
          vg init
          vg start --no-browser
          python - <<'PY'
          import json, time, urllib.request
          url = "http://127.0.0.1:7337/health"
          for _ in range(100):
              try:
                  with urllib.request.urlopen(url, timeout=.2) as response:
                      assert json.load(response)["status"] == "ok"
                      break
              except Exception:
                  time.sleep(.1)
          else:
              raise SystemExit("daemon health timeout")
          PY
          vg doctor --json
          vg search "backup" --provider claude_code --json > "$RUNNER_TEMP/claude-search.json"
          vg search "revision-aware" --provider codex --json > "$RUNNER_TEMP/codex-search.json"
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          root = os.environ["RUNNER_TEMP"]
          expected = {
              "claude-search.json": "claude_code",
              "codex-search.json": "codex",
          }
          for filename, provider in expected.items():
              rows = json.load(open(os.path.join(root, filename), encoding="utf-8"))
              if not rows or any(row.get("provider") != provider for row in rows):
                  raise SystemExit(f"installed-wheel {provider} search returned no valid rows")

          with urllib.request.urlopen("http://127.0.0.1:7337/api/sessions?limit=1") as response:
              payload = json.load(response)
          rows = payload.get("items", payload.get("sessions", []))
          if not rows:
              raise SystemExit("installed-wheel API returned no sessions")
          session_id = urllib.parse.quote(rows[0]["id"], safe="")
          for export_format in ("markdown", "canonical-jsonl"):
              url = (
                  f"http://127.0.0.1:7337/api/sessions/{session_id}/export"
                  f"?format={export_format}"
              )
              with urllib.request.urlopen(url) as response:
                  if not response.read(1024).strip():
                      raise SystemExit(f"empty installed-wheel {export_format} export")
          PY
          vg backup create "$RUNNER_TEMP/portable.vgbak"
          vg backup verify "$RUNNER_TEMP/portable.vgbak"
          vg stop
          vg backup restore "$RUNNER_TEMP/portable.vgbak" --to "$RUNNER_TEMP/restored"
          VIMGYM_PATH="$RUNNER_TEMP/restored" \
            vg search "revision-aware" --provider codex --json \
            > "$RUNNER_TEMP/restored-search.json"
          python - <<'PY'
          import json, os
          path = os.path.join(os.environ["RUNNER_TEMP"], "restored-search.json")
          rows = json.load(open(path, encoding="utf-8"))
          if not rows:
              raise SystemExit("restored installed-wheel vault is not searchable")
          PY
